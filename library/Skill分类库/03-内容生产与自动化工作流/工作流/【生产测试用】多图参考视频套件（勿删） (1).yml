    - data:
        code: "import re\nimport json\nfrom typing import Any, Dict, List\n\n\n# ✅\
          \ 所有常见分隔符统一处理\ndef _normalize_separators(s: str) -> str:\n    # 字面量转义符 →\
          \ 真实字符\n    s = s.replace('\\\\n', '\\n')\n    s = s.replace('\\\\r', '\\\
          r')\n    s = s.replace('\\\\t', '\\t')\n    # 中文逗号/顿号 → 英文逗号\n    s = s.replace('，',\
          \ ',')\n    s = s.replace('、', ',')\n    # 分号 → 逗号\n    s = s.replace(';',\
          \ ',')\n    s = s.replace('；', ',')\n    # 竖线 → 逗号\n    s = s.replace('|',\
          \ ',')\n    return s\n\n\ndef _to_list(value: Any) -> List[str]:\n    if\
          \ value is None:\n        return []\n    if isinstance(value, list):\n \
          \       result: List[str] = []\n        for item in value:\n           \
          \ result.extend(_to_list(item))\n        return result\n\n    s = str(value).strip()\n\
          \    if not s:\n        return []\n\n    # ✅ 统一分隔符\n    s = _normalize_separators(s)\n\
          \n    if s[0] in '[\"':\n        for candidate in (s, s.replace('\\\\\"\
          ', '\"')):\n            try:\n                parsed = json.loads(candidate)\n\
          \            except json.JSONDecodeError:\n                continue\n  \
          \          if isinstance(parsed, list):\n                result = []\n \
          \               for item in parsed:\n                    result.extend(_to_list(item))\n\
          \                return result\n            s = str(parsed).strip()\n  \
          \          break\n\n    # ✅ 按所有空白字符、换行、逗号分割\n    return [p.strip() for p\
          \ in re.split(r'[,\\s\\n\\r\\t]+', s) if p.strip()]\n\n\ndef main(urls:\
          \ Any = None) -> Dict[str, str]:\n    invalid = {\"\", \"null\", \"none\"\
          , \"undefined\", \"on\", \"off\"}\n    url_list = _to_list(urls)\n    valid_urls\
          \ = [\n        u for u in url_list\n        if u and u.lower() not in invalid\n\
          \        and (u.startswith(\"http://\") or u.startswith(\"https://\")) \
          \ # ✅ 只保留合法 URL\n    ]\n\n    return {\"video_urls\": json.dumps(valid_urls,\
          \ ensure_ascii=False)}"
