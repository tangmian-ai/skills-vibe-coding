    - data:
        code: "import re\n\ndef main(urls: str) -> dict:\n    invalid = [\"\", \"\
          null\", \"none\", \"undefined\"]\n    \n    # 去掉单引号、花括号、方括号等非URL字符\n   \
          \ urls = re.sub(r\"['\\\"\\{\\}\\[\\]]\", \"\", urls)\n    \n    # 按 |、逗号、空格分割\n\
          \    parts = re.split(r'[|\\s,]+', urls.strip())\n    \n    valid = []\n\
          \    for u in parts:\n        u = u.strip()\n        # 严格校验：必须是 http(s)://\
          \ 开头，且不含非法字符\n        if (u\n            and u.lower() not in invalid\n\
          \            and re.match(r'https?://[^\\s\\{\\}\\[\\]\\'\\\"]+$', u, re.IGNORECASE)\n\
          \        ):\n            valid.append(u)\n    \n    return {\n        \"\
          urls\": \"|\".join(valid)\n    }"
