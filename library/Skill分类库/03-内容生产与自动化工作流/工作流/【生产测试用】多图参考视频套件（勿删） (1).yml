          form: llm
          human_description:
            en_US: 'Reference image list in JSON array format. Includes subject, scene,
              style reference images, or first/last frame images.

              Format: [{"image_url": "url", "type": "first_frame"|"end_frame"}].

              When used as first/last frame, type parameter defines role: "first_frame"
              for first frame, "end_frame" for last frame.

              End frame without first frame is not supported. Cannot set end_frame
              if more than 2 images.

              Image format: .jpg/.jpeg/.png, max 10MB, min 300px, aspect ratio 1:2.5
              ~ 2.5:1.

              '
            ja_JP: 'Reference image list in JSON array format. Includes subject, scene,
              style reference images, or first/last frame images.

              Format: [{"image_url": "url", "type": "first_frame"|"end_frame"}].

              When used as first/last frame, type parameter defines role: "first_frame"
              for first frame, "end_frame" for last frame.

              End frame without first frame is not supported. Cannot set end_frame
              if more than 2 images.

              Image format: .jpg/.jpeg/.png, max 10MB, min 300px, aspect ratio 1:2.5
              ~ 2.5:1.

              '
            pt_BR: 'Reference image list in JSON array format. Includes subject, scene,
              style reference images, or first/last frame images.

              Format: [{"image_url": "url", "type": "first_frame"|"end_frame"}].

              When used as first/last frame, type parameter defines role: "first_frame"
              for first frame, "end_frame" for last frame.

              End frame without first frame is not supported. Cannot set end_frame
              if more than 2 images.

              Image format: .jpg/.jpeg/.png, max 10MB, min 300px, aspect ratio 1:2.5
              ~ 2.5:1.

              '
            zh_Hans: '参考图列表，JSON 数组格式。包括主体、场景、风格等参考图片，也可作为首帧或尾帧生成视频。

              格式: [{"image_url": "url", "type": "first_frame"|"end_frame"}]。

              作为首尾帧时需通过 type 参数定义："first_frame" 为首帧，"end_frame" 为尾帧。

              暂不支持仅尾帧（有尾帧时必须有首帧）。超过 2 张图片时不支持设置尾帧。

              图片格式：.jpg/.jpeg/.png，不超过 10MB，宽高不小于 300px，宽高比 1:2.5 ~ 2.5:1。

              '
