            4. 时长分配规则：\n   - 如果描述中明确提到时长（如\"持续3秒\"、\"3s\"），优先使用该数字\n   - 如果所有明确时长之和超过{{duration}}，则按各段时长比例缩短，每段取整秒，最后一段补足差值，每段最少1秒\n\
