<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #16181d;
        --card: #20242c;
        --line: #2c313b;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #2f6fed;
        --accent-hover: #4480ff;
      }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      header .count { font-size: 12px; color: var(--muted); }
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      button {
        font-size: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 7px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.45; cursor: default; }
      .list { max-height: 380px; overflow-y: auto; padding: 8px 14px 14px; }
      .section-title {
        font-size: 11px;
        color: var(--muted);
        margin: 10px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .thumb {
        width: 54px;
        height: 54px;
        flex: 0 0 54px;
        border-radius: 6px;
        object-fit: cover;
        background: #0d0f13;
      }
      .meta { flex: 1; min-width: 0; }
      .meta .name {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta .badge {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 40px 20px;
        line-height: 1.7;
      }
      .prompts { padding: 8px 14px 0; }
      .prompt-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .prompt-card .phead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .prompt-card .plabel { font-size: 11px; color: var(--accent-hover); font-weight: 600; }
      .prompt-card .ptext {
        font-size: 12px;
        color: var(--text);
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 120px;
        overflow-y: auto;
      }
      .prompt-card button { padding: 3px 8px; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Liblib 视频一键拔</h1>
      <span class="count" id="count"></span>
    </header>
    <div class="toolbar">
      <button class="primary" id="downloadAll">下载全部视频</button>
      <button id="copyAll">复制链接</button>
      <button id="refresh">刷新</button>
      <button id="clear">清空</button>
    </div>
    <div class="prompts" id="prompts"></div>
    <div class="list" id="list">
      <div class="empty">正在扫描当前页面…</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
