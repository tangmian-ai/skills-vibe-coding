    - data:
        code: "def main(resolution: str, video_model: str) -> dict:\n    r = (resolution\
          \ or \"\").strip().lower().rstrip(\"p\")\n    model = (video_model or \"\
          \").strip().lower()\n\n    mapping = {\n        \"480\":  \"512P\",\n  \
          \      \"512\":  \"512P\",\n        \"720\":  \"768P\",\n        \"768\"\
          :  \"768P\",\n        \"1080\": \"1080P\",\n    }\n\n    result = mapping.get(r,\
          \ \"768P\")\n\n    if result == \"512P\" and \"hailuo-02\" not in model:\n\
          \        result = \"768P\"\n\n    return {\"video_resolution\": result}"
