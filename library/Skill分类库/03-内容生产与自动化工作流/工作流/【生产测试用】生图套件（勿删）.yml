          \ 1_000_000,\n    \"2k\": 2_000_000,\n    \"3k\": 3_000_000,\n    \"4k\"\
          : 4_000_000,\n}\n\n# 即梦要求最少 3,686,400 像素\nMIN_PIXELS = 3_686_400\n\ndef\
          \ main(ratio: str, resolution: str) -> dict:\n    try:\n        res_key\
          \ = (resolution or \"4k\").strip().lower()\n        if res_key not in RESOLUTION_MAP:\n\
          \            raise ValueError(f\"不支持的档位 '{resolution}'，可选：1k / 2k / 3k /\
          \ 4k\")\n\n        target_pixels = max(RESOLUTION_MAP[res_key], MIN_PIXELS)\n\
          \n        normalized = unicodedata.normalize('NFKC', (ratio or \"\").strip())\n\
          \        parts = normalized.split(':')\n        if len(parts) != 2:\n  \
          \          raise ValueError(\"比例格式应为 '宽:高'，例如 '16:9'\")\n\n        w, h\
          \ = int(parts[0]), int(parts[1])\n        if w <= 0 or h <= 0:\n       \
          \     raise ValueError(\"宽高比数值必须为正整数\")\n\n        k = math.sqrt(target_pixels\
          \ / (w * h))\n        width  = max(8, round(k * w / 8) * 8)\n        height\
          \ = max(8, round(k * h / 8) * 8)\n\n        return {\"width\": width, \"\
          height\": height}\n\n    except (ValueError, ZeroDivisionError, IndexError)\
          \ as e:\n        return {\"error\": str(e)}"
        code_language: python3
