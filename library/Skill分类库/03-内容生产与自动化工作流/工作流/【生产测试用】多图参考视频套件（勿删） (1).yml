            \   - 如果描述中未提到时长，则将{{duration}}秒平均分配，若无法整除则最后一段补足差值\n5. 所有分镜的 duration\
            \ 之和必须严格等于{{duration}}\n6. 输出严格的 JSON 数组，格式如下：\n\n[\n  {\"index\": 1,\
            \ \"prompt\": \"分镜描述\", \"duration\": 数字},\n  {\"index\": 2, \"prompt\"\
            : \"分镜描述\", \"duration\": 数字}\n]\n\n只输出 JSON，不要有任何其他文字、解释或 markdown 代码块。"
