    - data:
        code: "urls = []\nif image_ref_urls:\n    if isinstance(image_ref_urls, list):\n\
          \        urls = [str(u).strip() for u in image_ref_urls if str(u).strip()]\n\
          \    elif isinstance(image_ref_urls, str):\n        s = image_ref_urls.strip()\n\
          \        if s.startswith(\"[\"):\n            try:\n                parsed\
          \ = json.loads(s)\n                if isinstance(parsed, list):\n      \
          \              urls = [str(u).strip() for u in parsed if str(u).strip()]\n\
          \            except Exception:\n                urls = []\n        if not\
          \ urls:\n            for sep in [\"|\", \",\", \"\\n\"]:\n             \
          \   if sep in s:\n                    urls = [u.strip() for u in s.split(sep)\
          \ if u.strip()]\n                    break\n            else:\n        \
          \        urls = [s] if s else []\n\nif len(urls) == 1:\n    lines.append(f\"\
          参考图：{urls[0]}\")\nelif len(urls) > 1:\n    for i, url in enumerate(urls,\
          \ 1):\n        lines.append(f\"参考图{i}：{url}\")"
