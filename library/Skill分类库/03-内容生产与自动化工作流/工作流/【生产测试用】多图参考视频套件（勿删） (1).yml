    - data:
        code: "import re\nimport json\nfrom typing import Any, Dict, List\n\n\ndef\
          \ _to_list(value: Any) -> List[str]:\n    \"\"\"将 None / 字符串 / list / JSON\
          \ 数组文本统一拆成字符串列表。\"\"\"\n    if value is None:\n        return []\n\n   \
          \ if isinstance(value, list):\n        result: List[str] = []\n        for\
          \ item in value:\n            result.extend(_to_list(item))\n        return\
          \ result\n\n    s = str(value).strip()\n    if not s:\n        return []\n\
          \n    # 仅在疑似 JSON 时尝试解析（兼容被转义的 \\\"）\n    if s[0] in '[\"':\n        for\
          \ candidate in (s, s.replace('\\\\\"', '\"')):\n            try:\n     \
          \           parsed = json.loads(candidate)\n            except json.JSONDecodeError:\n\
          \                continue\n            if isinstance(parsed, list):\n  \
          \              result = []\n                for item in parsed:\n      \
          \              result.extend(_to_list(item))\n                return result\n\
          \            s = str(parsed).strip()\n            break\n\n    # 普通字符串：按逗号或空格分割\n\
          \    return [p for p in re.split(r\"[,\\s]+\", s) if p]\n\n\ndef main(urls:\
          \ Any = None) -> Dict[str, str]:\n    invalid = {\"\", \"null\", \"none\"\
          , \"undefined\"}\n\n    valid = [\n        u.strip()\n        for u in _to_list(urls)\n\
          \        if u.strip() and u.strip().lower() not in invalid\n    ]\n\n  \
          \  return {\"video_urls\": \"|\".join(valid)}"
        code_language: python3
        outputs:
          video_urls:
            children: null
            type: string
