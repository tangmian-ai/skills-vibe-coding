    - data:
        code: "import json\nimport re\n\nINVALID = {\"\", \"null\", \"none\", \"undefined\"\
          , \"on\", \"off\"}  # ① 补充 on/off\n\n\ndef _valid(u):\n    s = str(u).strip().lower()\n\
          \    # ② 加 http 校验，过滤引用ID、占位符\n    return bool(u) and s not in INVALID and\
          \ (s.startswith(\"http://\") or s.startswith(\"https://\"))\n\n\ndef _extract_value(raw):\n\
          \    \"\"\"③ 如果是 output 元数据结构，提取真实 value。\"\"\"\n    if isinstance(raw,\
          \ str):\n        s = raw.strip()\n        if s.startswith('{'):\n      \
          \      try:\n                parsed = json.loads(s)\n            except\
          \ json.JSONDecodeError:\n                return raw\n            if \"output\"\
          \ in parsed and isinstance(parsed[\"output\"], dict):\n                return\
          \ parsed[\"output\"].get(\"value\", raw)\n            if \"value\" in parsed:\n\
          \                return parsed.get(\"value\", raw)\n    return raw\n\n\n\
          def _items(value):\n    \"\"\"递归把任意输入解析成 [{'image_url': ..., 'type'?: ...}]。\"\
          \"\"\n    if value is None:\n        return []\n\n    if isinstance(value,\
          \ dict):\n        url = value.get(\"image_url\") or value.get(\"url\")\n\
          \        if url is not None:\n            item = {\"image_url\": str(url).strip()}\n\
          \            if value.get(\"type\"):\n                item[\"type\"] = value[\"\
          type\"]\n            return [item]\n        keys = sorted(value.keys(),\n\
          \                      key=lambda k: int(k) if str(k).isdigit() else float(\"\
          inf\"))\n        out = []\n        for k in keys:\n            out.extend(_items(value[k]))\n\
          \        return out\n\n    if isinstance(value, list):\n        out = []\n\
          \        for it in value:\n            out.extend(_items(it))\n        return\
          \ out\n\n    s = str(value).strip()\n    if not s:\n        return []\n\n\
          \    if s[0] in '[{\"':\n        for cand in (s, s.replace('\\\\\"', '\"\
          ')):\n            try:\n                parsed = json.loads(cand)\n    \
          \        except json.JSONDecodeError:\n                continue\n      \
          \      if isinstance(parsed, (dict, list)):\n                return _items(parsed)\n\
          \            s = str(parsed).strip()\n            break\n\n    return [{\"\
          image_url\": p} for p in re.split(r\"[,\\s]+\", s) if p]\n\n\ndef main(data=None):\n\
          \    # ③ 先提取元数据结构中的真实值\n    data = _extract_value(data)\n\n    result =\
          \ []\n    seen = set()\n    for item in _items(data):\n        url = str(item.get(\"\
          image_url\", \"\")).strip()\n        if not _valid(url) or url in seen:\n\
          \            continue\n        seen.add(url)\n        clean = {\"image_url\"\
          : url}\n        if item.get(\"type\") in (\"first_frame\", \"end_frame\"\
          ):\n            clean[\"type\"] = item[\"type\"]\n        result.append(clean)\n\
          \n    return {\"result\": json.dumps(result, ensure_ascii=False)}"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 图片url>json
        type: code
        variables:
        - value_selector:
          - '1759044816853'
          - video_image
          value_type: string
          variable: data
