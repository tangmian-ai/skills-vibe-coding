    - data:
        code: "import json\nfrom typing import Any, Dict, List\n\n\ndef _parse_video_urls(value:\
          \ Any) -> List[str]:\n    \"\"\"将各种格式的输入解析为 URL 列表\"\"\"\n    if not value:\n\
          \        return []\n    if isinstance(value, list):\n        return [str(u).strip()\
          \ for u in value if str(u).strip()]\n    s = str(value).strip()\n    if\
          \ not s or s.lower() in {\"null\", \"none\", \"undefined\"}:\n        return\
          \ []\n    # JSON 数组字符串\n    if s.startswith('['):\n        try:\n      \
          \      parsed = json.loads(s)\n            if isinstance(parsed, list):\n\
          \                return [str(u).strip() for u in parsed if str(u).strip()]\n\
          \        except json.JSONDecodeError:\n            pass\n    # 单个 URL\n\
          \    if s.startswith(\"http://\") or s.startswith(\"https://\"):\n     \
          \   return [s]\n    return []\n\n\ndef main(                          #\
          \ ✅ 改为 main\n    video_urls: Any = None,        # ✅ Any 接收字符串或列表\n    arg2:\
          \ Any = None,\n    arg3: Any = None,\n) -> Dict[str, str]:\n\n    urls =\
          \ _parse_video_urls(video_urls)   # ✅ 先解析\n\n    if not urls:\n        return\
          \ {\"result\": \"\"}\n\n    refer_type = \"feature\" if str(arg2).strip()\
          \ == \"1\" else \"base\"\n\n    keep_sound_input = str(arg3).strip().lower()\
          \ if arg3 is not None else \"\"\n    keep_original_sound = (\n        \"\
          yes\" if keep_sound_input == \"yes\"\n        else \"no\" if keep_sound_input\
          \ == \"no\"\n        else None\n    )\n\n    result = []\n    for url in\
          \ urls:\n        item = {\"video_url\": url, \"refer_type\": refer_type}\n\
          \        if keep_original_sound is not None:\n            item[\"keep_original_sound\"\
          ] = keep_original_sound\n        result.append(item)\n\n    return {\"result\"\
          : json.dumps(result, ensure_ascii=False)}"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
