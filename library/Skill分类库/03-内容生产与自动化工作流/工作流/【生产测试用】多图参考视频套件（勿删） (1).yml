    - data:
        code: "import json\n\ndef main(params_used, video_model: str, ratio: str,\n\
          \         storyboard: str = \"0\", image_list=\"\") -> dict:\n    if isinstance(params_used,\
          \ dict):\n        params = params_used\n    elif params_used:\n        params\
          \ = json.loads(params_used)\n    else:\n        params = {}\n\n    is_storyboard\
          \ = str(storyboard) == \"1\"\n\n    audio_val = params.get(\"audio\", \"\
          \")\n    if str(audio_val).lower() in [\"1\", \"true\", \"on\", \"yes\"\
          ]:\n        audio_show = \"开启\"\n    else:\n        audio_show = \"关闭\"\n\
          \n    lines = [\n        f\"模型：{video_model}\",\n        f\"比例：{ratio}\"\
          ,\n        f\"时长：{params.get('duration', '')}s\",\n        f\"声音：{audio_show}\"\
          ,\n        f\"提示词模式：{'自定义分镜' if is_storyboard else '智能分镜'}\",\n        f\"\
          提示词：{params.get('prompt', '')}\",\n    ]\n    if params.get(\"resolution\"\
          ):\n        lines.append(f\"分辨率：{params['resolution']}\")\n\n    urls =\
          \ []\n    if image_list:\n        if isinstance(image_list, list):\n   \
          \         urls = [str(u).strip() for u in image_list if str(u).strip()]\n\
          \        elif isinstance(image_list, str):\n            s = image_list.strip()\n\
          \            if s.startswith(\"[\"):\n                try:\n           \
          \         parsed = json.loads(s)\n                    if isinstance(parsed,\
          \ list):\n                        urls = [str(u).strip() for u in parsed\
          \ if str(u).strip()]\n                except Exception:\n              \
          \      urls = []\n            if not urls:\n                for sep in [\"\
          |\", \",\", \"\\n\"]:\n                    if sep in s:\n              \
          \          urls = [u.strip() for u in s.split(sep) if u.strip()]\n     \
          \                   break\n                else:\n                    urls\
          \ = [s] if s else []\n\n    if len(urls) == 1:\n        lines.append(f\"\
          参考图：{urls[0]}\")\n    elif len(urls) > 1:\n        for i, url in enumerate(urls,\
          \ 1):\n            lines.append(f\"参考图{i}：{url}\")\n\n    return {\"summary\"\
          : \"\\n\".join(lines)}"
        code_language: python3
        outputs:
          summary:
            children: null
            type: string
