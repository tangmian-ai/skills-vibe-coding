    - data:
        code: "import json\nimport re\n\ndef main(llm_output: str, total_duration:\
          \ int) -> dict:\n    cleaned = llm_output.strip()\n    cleaned = re.sub(r\"\
          ^```(?:json)?\\s*\", \"\", cleaned)\n    cleaned = re.sub(r\"\\s*```$\"\
          , \"\", cleaned)\n    cleaned = cleaned.strip()\n\n    multi_prompt = json.loads(cleaned)\n\
          \    current_total = sum(item[\"duration\"] for item in multi_prompt)\n\n\
          \    if current_total <= total_duration:\n        return {\n           \
          \ \"multi_prompt\": json.dumps(multi_prompt, ensure_ascii=False),\n    \
          \        \"final_duration\": current_total\n        }\n\n    n = len(multi_prompt)\n\
          \n    if n > total_duration:\n        raise ValueError(f\"分镜数({n})超过总时长({total_duration}s)，无法每段保证至少1秒\"\
          )\n\n    adjusted = []\n    allocated = 0\n\n    for i, item in enumerate(multi_prompt):\n\
          \        if i == n - 1:\n            new_duration = total_duration - allocated\n\
          \        else:\n            new_duration = max(1, round(item[\"duration\"\
          ] / current_total * total_duration))\n            remaining_segments = n\
          \ - i - 1\n            max_allowed = total_duration - allocated - remaining_segments\n\
          \            new_duration = min(new_duration, max_allowed)\n\n        allocated\
          \ += new_duration\n        adjusted.append({**item, \"duration\": new_duration})\n\
          \n    return {\n        \"multi_prompt\": json.dumps(adjusted, ensure_ascii=False),\n\
          \        \"final_duration\": total_duration\n    }"
        code_language: python3
        outputs:
          final_duration:
            children: null
            type: number
          multi_prompt:
            children: null
            type: string
        selected: false
        title: 时长校对
        type: code
